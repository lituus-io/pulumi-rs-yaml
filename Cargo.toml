[workspace.package]
license = "AGPL-3.0-or-later"

[workspace]
resolver = "2"
members = [
    "crates/pulumi-rs-yaml-proto",
    "crates/pulumi-rs-yaml-core",
    "crates/pulumi-rs-yaml-language",
    "crates/pulumi-rs-yaml-converter",
    "crates/pulumi-rs-yaml-python",
]

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
semver = "1"
base64 = "0.22"
minijinja = { version = "2", features = ["debug", "loader", "multi_template"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8.6" # >=0.8.6 fixes RUSTSEC-2026-0097 (thread_rng unsoundness), API-compatible
pyo3 = { version = "0.29", features = ["extension-module"] }
heck = "0.5"
hcl-rs = "0.19"
rayon = "1"
starlark = "0.13"
pretty_assertions = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0
overflow-checks = false

# Size-optimize the parser-heavy dependencies; our own hot code stays at
# opt-level 3. polyglot_sql alone is ~46% of the binary's .text section.
[profile.release.package.polyglot-sql]
opt-level = "z"

[profile.release.package.starlark]
opt-level = "s"

# Mirrored onto the bench profile so the benchmark regression gate measures the
# same codegen the shipped binary uses.
[profile.bench.package.polyglot-sql]
opt-level = "z"

[profile.bench.package.starlark]
opt-level = "s"

[profile.release-small]
inherits = "release"
opt-level = "s"
