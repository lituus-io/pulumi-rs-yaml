[workspace.package]
license = "AGPL-3.0-or-later"

[workspace]
resolver = "2"
members = [
    "crates/pulumi-rs-yaml-proto",
    "crates/pulumi-rs-yaml-core",
    "crates/pulumi-rs-yaml-language",
    "crates/pulumi-rs-yaml-converter",
    "crates/pulumi-rs-yaml-python",
]

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: the checkpoint reader captures a resource's `inputs` as a borrowed
# slice of the caller's buffer, so a projection can be taken after the fact.
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
thiserror = "2"
semver = "1"
base64 = "0.22"
# Exact: `unstable_machinery` (the parser, for the slice rewrite in
# jinja/slice.rs) carries no semver guarantee. `fuel` and `loop_controls`
# are minijinja features, not crates.
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "debug", "macros", "multi_template", "adjacent_loop_items", "serde", "loader", "loop_controls", "fuel", "unstable_machinery"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8.6" # >=0.8.6 fixes RUSTSEC-2026-0097 (thread_rng unsoundness), API-compatible
pyo3 = { version = "0.29", features = ["extension-module"] }
heck = "0.5"
# RE2-lineage, like Go's regexp: linear time, no backreferences, no lookaround.
regex = "1"
hcl-rs = "0.19"
rayon = "1"
starlark = "0.13"
pretty_assertions = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0
overflow-checks = false

# Size-optimize the parser-heavy dependencies; our own hot code stays at
# opt-level 3. polyglot_sql alone is ~46% of the binary's .text section.
[profile.release.package.polyglot-sql]
opt-level = "z"

[profile.release.package.starlark]
opt-level = "s"

# The template engine renders each project file once per deploy; size-tuned
# it costs a few percent per render (measured in the jinja_* benches) and
# keeps the language host inside the +2% size gate with 0.5.40's methods,
# containers, dates and Python operators.
[profile.release.package.minijinja]
opt-level = "s"

# HCL is parsed only by GenerateProgram/GenerateProject (`pulumi convert`
# from PCL), never on a deploy and in no benchmark; size-tuned like the
# SQL parser.
[profile.release.package.hcl-edit]
opt-level = "z"

[profile.release.package.winnow]
opt-level = "z"

[profile.release.package.hcl-rs]
opt-level = "z"



# Mirrored onto the bench profile so the benchmark regression gate measures the
# same codegen the shipped binary uses.
[profile.bench.package.polyglot-sql]
opt-level = "z"

[profile.bench.package.starlark]
opt-level = "s"

[profile.bench.package.minijinja]
opt-level = "s"


[profile.release-small]
inherits = "release"
opt-level = "s"
