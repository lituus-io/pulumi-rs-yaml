resources:
  m:
    type: gcpx:dbt/model:Model
    properties:
      sql: |
        -- a comment containing  type: gcpx:dbt/model:Model
        SELECT '  sql: |' AS looks_like_a_key,
               'properties:' AS also_not_a_key
        ---
        ...
        {% if is_incremental() %}
        WHERE 1=1
        {% endif %}
      after: "{{ config.gcpProject }}"
