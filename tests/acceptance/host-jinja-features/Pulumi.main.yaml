{% import 'parts/lib.j2' as lib -%}
{% set tables = ['orders', 'customers', 'events', 'audit'] -%}
{% set ns = namespace(kept=[]) -%}
{% for t in tables -%}
{% if t == 'audit' %}{% break %}{% endif -%}
{% set ns.kept = ns.kept + [t] -%}
{% endfor -%}
{% set order = [] -%}
{% for t in tables %}{% do order.append(t.upper()) %}{% endfor -%}
{% do order.sort(reverse=true) -%}
{% set start = '2026-10-18'|to_date -%}
outputs:
{% include 'parts/common.j2' %}
  kept: {{ ns.kept | tojson }}
  reversed: {{ ns.kept[::-1] | tojson }}
  labels: {{ lib.labels('data', 3) }}
  names: {{ tables | map('upper') | join(',') | tojson }}
  sizes: {{ 1536 | filesizeformat(true) | tojson }}
  quoted: {{ 'a: b' | tojson }}
  order: {{ order | join(',') | tojson }}
  expires: {{ (start + timedelta(days=90)).isoformat() | tojson }}
  weekday: {{ start.strftime('%A') | tojson }}
  slug: {{ '{}-{:03d}'.format('Data Lake'.lower().replace(' ', '-'), 7) | tojson }}
