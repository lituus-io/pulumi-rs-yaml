name: graph-iam-bindings
runtime: yaml
description: Graph-export acceptance -- IAM bindings shaped like a data platform's access stack (literal, config-valued and resource-output members).
config:
  gcp:project:
    type: string
  group01:
    type: string
  group02:
    type: string
  group03:
    type: string
  group04:
    type: string
  group05:
    type: string
  group06:
    type: string
  group07:
    type: string
  sa01:
    type: string
  sa02:
    type: string
  sa03:
    type: string
  sa04:
    type: string
  sa05:
    type: string
  opsDomain:
    type: string
  auditUser:
    type: string
  partnerGroup:
    type: string
  apiToken:
    type: string
    secret: true
variables:
  teamDomain: example.com
  platformSa: platform-runner@sample-proj.iam.gserviceaccount.com
resources:
  etlSa:
    type: gcp:serviceaccount:Account
    properties:
      accountId: etl-loader
  reportSa:
    type: gcp:serviceaccount:Account
    properties:
      accountId: report-runner
  raw:
    type: gcp:bigquery:Dataset
    properties:
      datasetId: raw
      project: ${gcp:project}
  curated:
    type: gcp:bigquery:Dataset
    properties:
      datasetId: curated
      project: ${gcp:project}
  marts:
    type: gcp:bigquery:Dataset
    properties:
      datasetId: marts
      project: ${gcp:project}
  sandbox:
    type: gcp:bigquery:Dataset
    properties:
      datasetId: sandbox
      project: ${gcp:project}
  landing:
    type: gcp:storage:Bucket
    properties:
      location: US
  events:
    type: gcp:pubsub:Topic
  api:
    type: gcp:cloudrunv2:Service
    properties:
      location: us-central1
      template:
        containers:
          - image: us-docker.pkg.dev/cloudrun/container/hello
  grant01:
    type: gcp:bigquery:DatasetIamMember
    properties:
      datasetId: ${raw.datasetId}
      project: ${raw.project}
      role: roles/bigquery.dataViewer
      member: "user:analyst01@example.com"
  grant02:
