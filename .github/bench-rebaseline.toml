# Reviewed re-baselines for the benchmark regression gate
# (.github/scripts/bench_gate.py). The 25% threshold applies to every
# benchmark; an entry here moves ONE benchmark's expectation, recorded with
# what was measured and why, for ONE release. A further regression beyond
# 25% of the new expectation still fails, and the gate refuses an entry once
# the merge-base has reached `valid_for` -- delete it then.
#
# 0.5.40's entry (the include render handed to the deep-stack worker) retired
# with 0.5.41: 0.5.40 is the merge base, so its cost is the baseline.

[[bench]]
name = "jinja_preprocessor_include_at_cap"
valid_for = "0.5.45"
expected_ratio = 1.15
measured = """
CI x86_64 Linux, merge-base 0.5.44 -> PR head, three runs of the same commit:
2.4 -> 2.1 ms (0.88x) on the fastest runner, 2.7 -> 3.4 ms (1.26x) and
3.4 -> 4.3 ms (1.27x) on the slower ones, each re-measured twice with the
same result. Not reproduced elsewhere: on a dedicated x86_64 Linux VM (five
interleaved rounds, then two full passes) 4.55 -> 4.70 ms (1.03x); on macOS
aarch64 1.93 ms on both. Through the built wheel on that VM the same render
is 3.43 -> 3.38 ms.
"""
reason = """
0.5.45 changes one source file, checkpoint.rs, and this bench runs none of
it. The bench binary is one link-time-optimised unit, so code added anywhere
moves the placement of every other loop: on the dedicated VM 61 benches have
a median ratio of 0.999, with unrelated ones moving both ways
(needs_interpolation_pass_plain_4k 0.72x, has_jinja_block_syntax_scan 1.09x)
and the six checkpoint benches between 1.00x and 1.02x. This bench is the one
whose shift crosses the threshold, and only on one CI runner type, as in
0.5.40.
"""

[[bench]]
name = "split_statement_spans_1mib"
valid_for = "0.5.45"
expected_ratio = 1.15
measured = """
CI x86_64 Linux, merge-base 0.5.44 -> PR head, four runs: 0.73 -> 0.92 ms
(1.26x) and 0.51 -> 0.64 ms (1.27x) on one runner type, each re-measured
twice with the same result; 0.90 -> 0.93 ms (1.04x) and 1.12 -> 1.19 ms
(1.06x) on the other. On a dedicated x86_64 Linux VM (five interleaved
rounds, then two full passes) 1.98 -> 2.08 ms (1.05x); on macOS aarch64
0.84 ms on both.
"""
reason = """
The same cause as the entry above, on the other CI runner type: the bench
scans SQL text and runs none of checkpoint.rs, the one source file 0.5.45
changes. Its scan is a tight byte loop, and where that loop lands in the
link-time-optimised bench binary moved with the added code.
"""
