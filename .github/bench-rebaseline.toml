# Reviewed re-baselines for the benchmark regression gate
# (.github/scripts/bench_gate.py). The 25% threshold applies to every
# benchmark; an entry here moves ONE benchmark's expectation, recorded with
# what was measured and why, for ONE release. A further regression beyond
# 25% of the new expectation still fails, and the gate refuses an entry once
# the merge-base has reached `valid_for` -- delete it then.

[[bench]]
name = "jinja_preprocessor_include_at_cap"
valid_for = "0.5.40"
expected_ratio = 1.51
measured = """
CI x86_64 Linux, merge-base 0.5.39 -> PR head, three runs:
1.78 -> 1.79 ms (1.01x) on the faster runner type, 2.55 -> 3.51 ms (1.37x)
and 2.78 -> 4.20 ms (1.51x) on the slower one. Not reproduced elsewhere:
on an aarch64 Linux VM (interleaved runs) 0.5.40 renders it in 1.9 ms against
0.5.39's 2.2-2.6 ms, with 0 minor page faults per render against 722; on
macOS +4%.
"""
reason = """
A template that includes another is handed to the deep-stack worker (a
64 MiB thread, one per calling thread), because the included text may define
and call a recursive macro, which overflowed Windows' 1 MiB main-thread stack
before the recursion limit (0.5.40 'Recursion reaches its limit on any
stack'). This bench's include is the largest the loader serves, 1 MiB, so its
render is produced on the worker and released on the caller: a 1 MiB result
crossing threads. The cost appears only on one CI runner type; the handoff
itself costs ~35 us on CI, far less than the measured difference, and the
rest is not attributable without that hardware.
"""
