name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      # Every authored file carries the Author/Copyright pair in its own
      # comment syntax; the script lists what it excludes and why.
      - name: File headers
        run: python3 scripts/check_headers.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
      # `fuzz/` is its own workspace, so the line above has never reached it.
      # A clippy error sat in `fuzz_scope_oracle` unnoticed because of that.
      # The targets build on nightly, but they LINT on stable, so this needs no
      # second toolchain.
      - run: cargo clippy --all-targets --manifest-path fuzz/Cargo.toml -- -D warnings

  test-linux-x86:
    name: Test (Linux x86_64)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-linux-arm:
    name: Test (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-macos-arm:
    name: Test (macOS ARM64)
    runs-on: macos-15
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-windows:
    name: Test (Windows x86_64)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides the
      # rust-toolchain.toml pin — so the pinned MSRV must be requested here
      # explicitly or it is never exercised in CI. 1.90 is the floor because
      # polyglot-sql's `stacker` feature needs >= 1.88.
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  no-default-features:
    name: Build without optional features
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sql-lineage feature pulls in a SQL parser worth ~half the
      # language host's size; keep the opt-out compiling.
      - run: cargo check -p pulumi-rs-yaml-core --no-default-features
      - run: cargo check -p pulumi-rs-yaml-language --no-default-features
      - run: cargo check -p pulumi-rs-yaml-python --no-default-features
      - run: cargo check -p pulumi-rs-yaml-converter --no-default-features

  binary-size:
    name: Binary size
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
      # Gates every release artefact at +2% against the previous release, so a
      # dependency can never again silently double a binary. The previous
      # release is the newest `v*` tag this commit descends from, other than
      # one on this commit itself; it is built here, with the same toolchain
      # and link configuration, into its own target directory.
      #
      # RUSTFLAGS is cleared deliberately: an env-level RUSTFLAGS makes cargo
      # ignore `target.*.rustflags` from .cargo/config.toml, so the rest of CI
      # never exercises the real release link configuration. Clearing it here
      # means this job links exactly like release.yml does.
      - name: Measure this commit and the previous release
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          measure() {  # $1 = source dir, $2 = target dir, $3 = output json (absolute: measure cds into $1)
            ( cd "$1"
              export CARGO_TARGET_DIR="$2"
              cargo build --release -p pulumi-rs-yaml-language -p pulumi-rs-yaml-converter -p pulumi-rs-yaml-python
              full=$(stat -c%s "$2/release/pulumi-language-yaml")
              conv=$(stat -c%s "$2/release/pulumi-converter-yaml")
              ext=$(stat -c%s "$2/release/libpulumi_yaml_rs.so")
              cargo build --release -p pulumi-rs-yaml-language --no-default-features
              slim=$(stat -c%s "$2/release/pulumi-language-yaml")
              printf '{"pulumi-language-yaml (full)": %s, "pulumi-language-yaml (--no-default-features)": %s, "pulumi-converter-yaml": %s, "python extension (pulumi_yaml_rs)": %s}\n' \
                "$full" "$slim" "$conv" "$ext" > "$3" )
          }
          head=$(git rev-parse HEAD)
          previous=""
          for tag in $(git tag --merged HEAD --sort=-v:refname 'v*'); do
            if [ "$(git rev-list -n1 "$tag")" != "$head" ]; then previous="$tag"; break; fi
          done
          measure "$PWD" "$PWD/target" "$PWD/current.json"
          if [ -z "$previous" ]; then
            echo "no previous release tag; nothing to gate against" | tee -a "$GITHUB_STEP_SUMMARY"
            cp current.json previous.json
            echo "PREVIOUS=none" >> "$GITHUB_ENV"
          else
            git worktree add --detach ../previous "$previous"
            measure "$PWD/../previous" "$PWD/../previous-target" "$PWD/previous.json"
            echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          fi
      - name: Gate at +2% per artefact
        run: python3 .github/scripts/size_gate.py previous.json current.json --max-growth-pct 2 --label "$PREVIOUS" --summary "$GITHUB_STEP_SUMMARY"
      - name: The gate fails on growth (self-test)
        run: |
          echo '{"x": 1000}' > p.json
          echo '{"x": 1021}' > c.json
          if python3 .github/scripts/size_gate.py p.json c.json; then
            echo "::error::the size gate passed a 2.1% growth"; exit 1
          fi
          echo '{"x": 1020}' > c.json
          python3 .github/scripts/size_gate.py p.json c.json

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pulumi pulumi-random
      - name: Build and install Python package
        working-directory: crates/pulumi-rs-yaml-python
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          maturin develop --release
      - name: Run Python tests
        working-directory: crates/pulumi-rs-yaml-python
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          pytest tests/ -v --ignore=tests/test_cli_integration.py

  cross-check:
    name: Cross-compile check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: Ensure musl targets installed
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Check musl x86_64
        run: cargo zigbuild --workspace --exclude pulumi-rs-yaml-python --target x86_64-unknown-linux-musl --release
      - name: Check musl aarch64
        run: cargo zigbuild --workspace --exclude pulumi-rs-yaml-python --target aarch64-unknown-linux-musl --release

  # The engine is held to pinned reference Jinja2. The goldens are committed,
  # so every test job already compares against them; this job regenerates
  # them from the pinned reference and fails on any drift, so a golden can
  # never be edited by hand into agreement with the engine.
  jinja-conformance:
    name: Jinja conformance (reference Jinja2)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned reference
        run: pip install --require-hashes --no-binary markupsafe -r scripts/jinja_conformance/requirements.txt
      - name: Regenerate the goldens and fail on drift
        run: python scripts/jinja_conformance/generate.py --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render the corpus and check the matrix
        run: cargo test -p pulumi-rs-yaml-core --test jinja_conformance

  benchmark-regression:
    name: Benchmark Regression Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: fmt
    # The merge-base is benched as it was built on main, where -D warnings
    # did not apply to bench builds; a lint newer than that commit must not
    # fail the baseline.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Install critcmp
        run: cargo install critcmp --locked

      # Target the criterion bench directly: `cargo bench --workspace` would
      # forward the criterion-only --save-baseline flag to every crate's
      # default libtest bench harness, which rejects it.
      - name: Benchmark merge-base (baseline)
        run: |
          git checkout "$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          cargo bench -p pulumi-rs-yaml-core --bench core_bench -- --save-baseline base

      - name: Benchmark PR head
        run: |
          # benching at the merge-base can rewrite Cargo.lock; discard it so
          # the checkout of the PR head doesn't abort on a dirty tree
          git checkout -f ${{ github.sha }}
          cargo bench -p pulumi-rs-yaml-core --bench core_bench -- --save-baseline head

      # Fail if any benchmark regressed beyond the noise threshold (25%).
      # Same-runner back-to-back runs keep hardware variance low, but shared
      # runners are still noisy -- the threshold is deliberately generous.
      # The threshold is the same for every benchmark; the reviewed
      # .github/bench-rebaseline.toml can move one benchmark's expectation
      # for one named release, never the threshold (see bench_gate.py).
      - name: Compare against baseline
        run: |
          critcmp base head | tee critcmp.txt
          for side in base head; do
            critcmp --export "$side" | python3 -c 'import json,sys; print(json.dumps({n: b["criterion_estimates_v1"]["mean"]["point_estimate"] for n, b in json.load(sys.stdin)["benchmarks"].items()}))' > "$side.json"
          done
          merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          base_version="$(git show "$merge_base:crates/pulumi-rs-yaml-core/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          python3 .github/scripts/bench_gate.py base.json head.json \
            --base-version "$base_version" --rebaseline .github/bench-rebaseline.toml

      # The gate itself, held to what it promises: a re-baselined bench still
      # fails past 25% of its new expectation, any other bench past 25% of
      # the merge-base, and an entry is refused once its release is reached.
      - name: The benchmark gate still fails on regression (self-test)
        run: |
          g=.github/scripts/bench_gate.py
          # A fixture entry: the real file holds entries only while a
          # release needs them, and the gate refuses one past its release.
          r=bench-rebaseline.selftest.toml
          printf '%s\n' '[[bench]]' 'name = "jinja_preprocessor_include_at_cap"' \
            'valid_for = "1.0.0"' 'expected_ratio = 1.51' \
            'measured = "fixture"' 'reason = "fixture"' > $r
          echo '{"jinja_preprocessor_include_at_cap": 1000000, "other": 1000000}' > tb.json
          echo '{"jinja_preprocessor_include_at_cap": 1500000, "other": 1000000}' > th.json
          python3 $g tb.json th.json --base-version 0.0.1 --rebaseline $r
          echo '{"jinja_preprocessor_include_at_cap": 2000000, "other": 1000000}' > th.json
          if python3 $g tb.json th.json --base-version 0.0.1 --rebaseline $r; then
            echo "::error::a re-baselined bench past 25% of its expectation passed"; exit 1
          fi
          echo '{"jinja_preprocessor_include_at_cap": 1000000, "other": 1300000}' > th.json
          if python3 $g tb.json th.json --base-version 0.0.1 --rebaseline $r; then
            echo "::error::a 30% regression of an ordinary bench passed"; exit 1
          fi
          echo '{"jinja_preprocessor_include_at_cap": 1000000, "other": 1000000}' > th.json
          if python3 $g tb.json th.json --base-version 999.0.0 --rebaseline $r; then
            echo "::error::a stale re-baseline entry was accepted"; exit 1
          fi

  # The one check a branch rule needs to require. A job skipped because a
  # job it needs failed counts as passing to GitHub, so this job always runs
  # and fails unless every job it lists succeeded -- the benchmark regression
  # check included. On a push to main the benchmark job is skipped by design,
  # and skipped is accepted only there.
  ci-gate:
    name: CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test-linux-x86
      - test-linux-arm
      - test-macos-arm
      - test-windows
      - msrv
      - no-default-features
      - binary-size
      - python-test
      - jinja-conformance
      - cross-check
      - benchmark-regression
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import json, os, sys

          failed = []
          for name, job in json.loads(os.environ["RESULTS"]).items():
              result = job["result"]
              if result == "success":
                  continue
              if (
                  result == "skipped"
                  and name == "benchmark-regression"
                  and os.environ["EVENT"] != "pull_request"
              ):
                  continue
              failed.append(f"{name}: {result}")
          if failed:
              print("required jobs did not pass:")
              print("\n".join(failed))
              sys.exit(1)
          print("every required job passed")
          EOF
