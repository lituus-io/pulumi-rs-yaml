name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test-linux-x86:
    name: Test (Linux x86_64)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-linux-arm:
    name: Test (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-macos-arm:
    name: Test (macOS ARM64)
    runs-on: macos-15
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-windows:
    name: Test (Windows x86_64)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides the
      # rust-toolchain.toml pin — so the pinned MSRV must be requested here
      # explicitly or it is never exercised in CI. 1.90 is the floor because
      # polyglot-sql's `stacker` feature needs >= 1.88.
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  no-default-features:
    name: Build without optional features
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sql-lineage feature pulls in a SQL parser worth ~half the
      # language host's size; keep the opt-out compiling.
      - run: cargo check -p pulumi-rs-yaml-core --no-default-features
      - run: cargo check -p pulumi-rs-yaml-language --no-default-features
      - run: cargo check -p pulumi-rs-yaml-python --no-default-features
      - run: cargo check -p pulumi-rs-yaml-converter --no-default-features

  binary-size:
    name: Binary size
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
      # Reports sizes so a dependency can never again silently double the
      # binary unnoticed. Informational: it prints, it does not gate.
      #
      # RUSTFLAGS is cleared deliberately: an env-level RUSTFLAGS makes cargo
      # ignore `target.*.rustflags` from .cargo/config.toml, so the rest of CI
      # never exercises the real release link configuration. Clearing it here
      # means this job links exactly like release.yml does.
      - name: Build and report sizes
        env:
          RUSTFLAGS: ""
        run: |
          cargo build --release -p pulumi-rs-yaml-language -p pulumi-rs-yaml-converter
          full_host=$(stat -c%s target/release/pulumi-language-yaml)
          conv=$(stat -c%s target/release/pulumi-converter-yaml)
          cargo build --release -p pulumi-rs-yaml-language --no-default-features
          slim_host=$(stat -c%s target/release/pulumi-language-yaml)
          {
            echo "### Release binary sizes"
            echo ""
            echo "| Binary | Bytes | MiB |"
            echo "|---|---:|---:|"
            printf '| pulumi-language-yaml (full) | %s | %.2f |\n' "$full_host" "$(echo "scale=4; $full_host/1048576" | bc)"
            printf '| pulumi-language-yaml (--no-default-features) | %s | %.2f |\n' "$slim_host" "$(echo "scale=4; $slim_host/1048576" | bc)"
            printf '| pulumi-converter-yaml | %s | %.2f |\n' "$conv" "$(echo "scale=4; $conv/1048576" | bc)"
          } >> "$GITHUB_STEP_SUMMARY"

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pulumi pulumi-random
      - name: Build and install Python package
        working-directory: crates/pulumi-rs-yaml-python
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          maturin develop --release
      - name: Run Python tests
        working-directory: crates/pulumi-rs-yaml-python
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          pytest tests/ -v --ignore=tests/test_cli_integration.py

  cross-check:
    name: Cross-compile check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: Ensure musl targets installed
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Check musl x86_64
        run: cargo zigbuild --workspace --exclude pulumi-rs-yaml-python --target x86_64-unknown-linux-musl --release
      - name: Check musl aarch64
        run: cargo zigbuild --workspace --exclude pulumi-rs-yaml-python --target aarch64-unknown-linux-musl --release
