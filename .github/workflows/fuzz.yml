name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 3'  # Weekly on Wednesday at 3 AM UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        default: '60'
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ inputs.duration || '60' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_yaml_parser
          - fuzz_interpolation
          - fuzz_jinja
          - fuzz_builtins
          - fuzz_converter
          - fuzz_yaml_bomb
          - fuzz_extra_context
          - fuzz_starlark
          - fuzz_parallel_eval
          - fuzz_resource_graph
          - fuzz_sql_lineage
          - fuzz_scope_roundtrip
          - fuzz_scope_oracle
          - fuzz_scope_render_identity
          - fuzz_scope_unlisted_noop
          - fuzz_scope_settings
          - fuzz_scope_never_panics
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      # Without this the corpus starts from the committed seeds every week, so
      # coverage never compounds and each run rediscovers the trivial inputs.
      # The key rotates per run and restores from the newest prefix match,
      # which is how a cache accumulates rather than freezes.
      - name: Restore evolved corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            corpus-${{ matrix.target }}-

      # rust-toolchain.toml pins an older MSRV for this repo, but cargo-fuzz needs a
      # newer rustc to build — install it with the nightly toolchain
      # explicitly (same pattern as cargo-audit in security.yml).
      - name: Install cargo-fuzz
        run: RUSTUP_TOOLCHAIN=nightly cargo install cargo-fuzz --locked

      - name: Run fuzzer
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_DURATION }}

      # Keep the corpus small enough to stay useful: cmin drops inputs that add
      # no coverage the rest of the set already has.
      - name: Minimise corpus
        if: always()
        working-directory: fuzz
        run: cargo +nightly fuzz cmin ${{ matrix.target }} || true

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
