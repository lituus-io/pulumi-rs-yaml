name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 3'  # Weekly on Wednesday at 3 AM UTC
  # A pull request runs only the registration and badge check below, and
  # only when something it reads changes; the fuzzing itself stays weekly.
  pull_request:
    paths:
      - README.md
      - fuzz/**
      - crates/pulumi-rs-yaml-core/tests/security_tests.rs
      - .github/workflows/fuzz.yml
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        default: '120'
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # 60s under-explored: three separate latent defects were found at 120s that
  # the weekly run had never reached, one of them sitting unnoticed for days.
  FUZZ_DURATION: ${{ inputs.duration || '120' }}
  # PINNED, and it has to be. cargo-fuzz requires nightly, and this job took
  # whatever nightly was current that morning — so every rustc change was a
  # coin flip on whether the week's fuzzing ran at all. It came up tails on
  # 2026-08-25: `allocative` (a starlark dependency, and starlark is a core
  # dependency, so every target links it) declares `impl Allocative for !`
  # behind a build-script `rust_nightly` cfg, alongside an impl for
  # `Infallible`. That nightly made the two the same type, so the crate stopped
  # compiling with E0119 and ALL 17 targets failed — not one of them a finding.
  #
  # Bisected: nightly-2026-08-24 builds, nightly-2026-08-25 does not. Bumping
  # allocative does not help; 0.3.6 carries the same pair of impls, and the cfg
  # is set by a build script rather than a cargo feature, so it cannot be
  # switched off from here.
  #
  # Unpin when allocative ships a version that guards the never-type impl (or
  # drops it): move this forward and delete the note. A pinned toolchain is
  # also just better practice for fuzzing, where a corpus compounds across runs
  # and a build that changes underneath you is noise in the results.
  FUZZ_TOOLCHAIN: nightly-2026-08-24

jobs:
  # Registering a target in fuzz/Cargo.toml makes it buildable; listing it in
  # the matrix below is what makes it RUN. Two separate edits, and forgetting
  # the second is silent — a target sits in the tree, passes review, counts
  # toward the README badge, and never executes. This job compares the two
  # lists so the gap fails loudly instead.
  matrix-covers-every-target:
    name: Every registered target is in the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare fuzz/Cargo.toml bins against the matrix, the README and its badges
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          cargo = pathlib.Path("fuzz/Cargo.toml").read_text()
          registered = set(re.findall(r'\[\[bin\]\]\s*\nname = "([^"]+)"', cargo))

          wf = pathlib.Path(".github/workflows/fuzz.yml").read_text()
          block = wf.split("        target:", 1)[1]
          listed = set(re.findall(r"^\s+- (fuzz_\w+)\s*$", block, re.M))

          failed = False
          missing = registered - listed
          extra = listed - registered
          if missing:
              print(f"::error::registered but never run: {sorted(missing)}")
          if extra:
              print(f"::error::in the matrix but not registered: {sorted(extra)}")
          failed |= bool(missing or extra)

          # The README's badges are numbers a reader trusts; hold each to
          # the thing it counts. scope_grammar.rs is a shared generator, not
          # a target, so the fuzz badge counts registrations, not files.
          readme = pathlib.Path("README.md").read_text()

          def badge(label):
              m = re.search(rf"badge/{label}-(\d+)-", readme)
              if not m:
                  print(f"::error::README has no '{label}' badge")
                  return None
              return int(m.group(1))

          fuzz_badge = badge("fuzz%20targets")
          if fuzz_badge is not None and fuzz_badge != len(registered):
              print(f"::error::README fuzz badge says {fuzz_badge}, fuzz/Cargo.toml registers {len(registered)}")
              failed = True
          fuzz_section = readme.split("## Fuzz", 1)[-1].split("\n## ", 1)[0]
          unnamed = registered - set(re.findall(r"`(fuzz_\w+)`", fuzz_section))
          if unnamed:
              print(f"::error::registered but not listed in the README's Fuzz section: {sorted(unnamed)}")
              failed = True

          sec = pathlib.Path("crates/pulumi-rs-yaml-core/tests/security_tests.rs").read_text()
          tests = len(re.findall(r"^\s*#\[test\]", sec, re.M))
          sec_badge = badge("security%20tests")
          if sec_badge is not None and sec_badge != tests:
              print(f"::error::README security-tests badge says {sec_badge}, security_tests.rs has {tests}")
              failed = True
          failed |= fuzz_badge is None or sec_badge is None

          if failed:
              sys.exit(1)
          print(f"{len(registered)} fuzz targets, all in the matrix, the README and its badge; {tests} security tests match their badge")
          PY

  fuzz:
    name: Fuzz (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_yaml_parser
          - fuzz_interpolation
          - fuzz_string_filters
          - fuzz_derive_string
          - fuzz_jinja
          - fuzz_jinja_template
          - fuzz_jinja_loader
          - fuzz_jinja_conformance
          - fuzz_jinja_methods
          - fuzz_builtins
          - fuzz_converter
          - fuzz_yaml_bomb
          - fuzz_extra_context
          - fuzz_starlark
          - fuzz_parallel_eval
          - fuzz_resource_graph
          - fuzz_sql_lineage
          - fuzz_sql_statements
          - fuzz_scope_roundtrip
          - fuzz_scope_oracle
          - fuzz_scope_render_identity
          - fuzz_scope_unlisted_noop
          - fuzz_scope_settings
          - fuzz_scope_never_panics
          - fuzz_native_str
          - fuzz_checkpoint
          - fuzz_stack_uri
          - fuzz_cross_stack
          - fuzz_iam_graph
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      # Without this the corpus starts from the committed seeds every week, so
      # coverage never compounds and each run rediscovers the trivial inputs.
      # The key rotates per run and restores from the newest prefix match,
      # which is how a cache accumulates rather than freezes.
      - name: Restore evolved corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            corpus-${{ matrix.target }}-

      # rust-toolchain.toml pins an older MSRV for this repo, but cargo-fuzz needs a
      # newer rustc to build — install it with the nightly toolchain
      # explicitly (same pattern as cargo-audit in security.yml).
      - name: Install cargo-fuzz
        run: RUSTUP_TOOLCHAIN=${{ env.FUZZ_TOOLCHAIN }} cargo install cargo-fuzz --locked

      - name: Run fuzzer
        working-directory: fuzz
        run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz run ${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_DURATION }}

      # Keep the corpus small enough to stay useful: cmin drops inputs that add
      # no coverage the rest of the set already has.
      - name: Minimise corpus
        if: always()
        working-directory: fuzz
        run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz cmin ${{ matrix.target }} || true

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
