name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-output.txt
            target/criterion/

  benchmark-regression:
    name: Benchmark Regression Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Install critcmp
        run: cargo install critcmp --locked

      # Target the criterion bench directly: `cargo bench --workspace` would
      # forward the criterion-only --save-baseline flag to every crate's
      # default libtest bench harness, which rejects it.
      - name: Benchmark merge-base (baseline)
        run: |
          git checkout "$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          cargo bench -p pulumi-rs-yaml-core --bench core_bench -- --save-baseline base

      - name: Benchmark PR head
        run: |
          git checkout ${{ github.sha }}
          cargo bench -p pulumi-rs-yaml-core --bench core_bench -- --save-baseline head

      # Fail if any benchmark regressed beyond the noise threshold (25%).
      # Same-runner back-to-back runs keep hardware variance low, but shared
      # runners are still noisy — the threshold is deliberately generous.
      - name: Compare against baseline
        run: |
          critcmp base head | tee critcmp.txt
          python3 - <<'EOF'
          import json, subprocess, sys

          export = subprocess.run(
              ["critcmp", "--export", "base"], capture_output=True, text=True, check=True
          )
          base = {
              name: bench["criterion_estimates_v1"]["mean"]["point_estimate"]
              for name, bench in json.loads(export.stdout)["benchmarks"].items()
          }
          export = subprocess.run(
              ["critcmp", "--export", "head"], capture_output=True, text=True, check=True
          )
          head = {
              name: bench["criterion_estimates_v1"]["mean"]["point_estimate"]
              for name, bench in json.loads(export.stdout)["benchmarks"].items()
          }

          THRESHOLD = 1.25
          regressions = []
          for name, base_mean in base.items():
              head_mean = head.get(name)
              if head_mean is not None and head_mean > base_mean * THRESHOLD:
                  regressions.append(
                      f"{name}: {base_mean:.0f}ns -> {head_mean:.0f}ns "
                      f"({head_mean / base_mean:.2f}x)"
                  )

          if regressions:
              print("benchmark regressions beyond 25% threshold:")
              print("\n".join(regressions))
              sys.exit(1)
          print(f"no regressions beyond 25% across {len(base)} benchmarks")
          EOF
