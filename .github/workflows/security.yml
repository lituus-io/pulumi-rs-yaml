name: Security

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9 AM UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: RUSTUP_TOOLCHAIN=stable cargo install cargo-audit --locked
      # Both lockfiles ship something: the root one the binaries, the PyPI
      # wheels and the tests, fuzz the fuzz targets. Only vulnerabilities fail
      # the job (cargo-audit's default). Informational advisories (unmaintained,
      # unsound) and yanked crates are surfaced as warning annotations on the
      # run instead of failing it.
      - name: Audit every lockfile
        shell: bash
        run: |
          rc=0
          for lock in Cargo.lock fuzz/Cargo.lock; do
            echo "::group::$lock"
            cargo audit -f "$lock" || rc=1
            echo "::endgroup::"
            cargo audit -f "$lock" --json 2>/dev/null \
              | jq -r --arg lock "$lock" '
                  .warnings // {} | to_entries[] | .value[]
                  | "::warning title=\(.kind) dependency (\($lock))::\(.package.name) \(.package.version): \(.advisory.id // "yanked") \(.advisory.title // "")"
                ' | sort -u || true
          done
          exit $rc

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  clippy-security:
    name: Clippy Security Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy with security lints
        run: |
          cargo clippy --all-targets -- \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic
