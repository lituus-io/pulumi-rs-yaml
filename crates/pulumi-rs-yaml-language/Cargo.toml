[package]
name = "pulumi-rs-yaml-language"
version = "0.5.23"
edition = "2021"
description = "Pulumi YAML language host plugin (Rust implementation)"
license.workspace = true

[[bin]]
name = "pulumi-language-yaml"
path = "src/main.rs"

[features]
default = ["sql-lineage"]
# Forwards the core feature: `--no-default-features` builds a language
# host without the SQL parser (the `graph --lineage` flag is then
# unavailable) for a substantially smaller binary.
sql-lineage = ["pulumi-rs-yaml-core/sql-lineage"]

[dependencies]
pulumi-rs-yaml-proto = { path = "../pulumi-rs-yaml-proto" }
pulumi-rs-yaml-core = { path = "../pulumi-rs-yaml-core", default-features = false }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio-stream = "0.1"
ctrlc = "3"
base64 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
