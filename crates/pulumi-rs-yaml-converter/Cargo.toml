[package]
name = "pulumi-rs-yaml-converter"
version = "0.5.22"
edition = "2021"
description = "Pulumi YAML converter plugin (Rust implementation)"
license.workspace = true

[[bin]]
name = "pulumi-converter-yaml"
path = "src/main.rs"

[dependencies]
pulumi-rs-yaml-proto = { path = "../pulumi-rs-yaml-proto" }
# The converter uses only ast/schema/packages/diag — never the graph or
# lineage exporters. Default features here would force polyglot-sql into the
# shared core rlib for the whole release build (both binaries are built in one
# cargo invocation), defeating the language host's opt-out.
pulumi-rs-yaml-core = { path = "../pulumi-rs-yaml-core", default-features = false }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
heck = { workspace = true }
base64 = { workspace = true }
tokio-stream = "0.1"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
