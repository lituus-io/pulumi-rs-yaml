[package]
name = "pulumi-rs-yaml-python"
version = "0.5.19"
edition = "2021"
description = "Python bindings for pulumi-rs-yaml via PyO3"
license.workspace = true

[lib]
name = "pulumi_yaml_rs"
crate-type = ["cdylib"]

[dependencies]
pulumi-rs-yaml-core = { path = "../pulumi-rs-yaml-core", default-features = false }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[features]
default = ["abi3", "sql-lineage"]
sql-lineage = ["pulumi-rs-yaml-core/sql-lineage"]
abi3 = ["pyo3/abi3-py39"]
