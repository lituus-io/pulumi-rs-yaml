[advisories]
# Only a real vulnerability fails the gate. Informational advisories
# (unmaintained, unsound) and yanked crates are not CVEs: they are reported as
# warnings by the `Security Audit` job in security.yml, which annotates the run
# without failing it. Long-standing ones seen so far:
#   - derivative, fxhash, paste: transitive through the starlark crate (by
#     Meta) v0.13; upstream issues, until starlark migrates to alternatives.
#   - unsafe-libyaml: the libyaml port under serde_yaml 0.9, itself deprecated.
#     Unmaintained, not vulnerable. It is every YAML read the engine makes, so
#     replacing it is a parser migration of its own, not a lockfile bump.
unmaintained = "none"
unsound = "none"
yanked = "warn"
# A vulnerability deliberately accepted must be listed here WITH a reason, never
# silently suppressed by loosening the gate above. The fix for a vulnerability
# is normally `cargo update -p <crate>` in each lockfile (root and fuzz).
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "AGPL-3.0-or-later",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
